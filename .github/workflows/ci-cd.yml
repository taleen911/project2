name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check runner
        run: |
          echo "Runner is working"
          uname -a
          docker --version
          docker compose version

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/project2-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/project2-backend:latest

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/project2-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/project2-frontend:latest
