name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/project2-backend:latest ./backend

      - name: Push Backend
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/project2-backend:latest

      - name: Build Frontend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/project2-frontend:latest ./frontend

      - name: Push Frontend
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/project2-frontend:latest
